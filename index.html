<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボール分裂シミュレータ</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #09090e;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        body.hide-cursor {
            cursor: none;
        }
        canvas {
            display: block;
            background: #12121c;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 14px;
            letter-spacing: 0.05em;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .ui-panel div {
            margin-bottom: 6px;
        }
        .ui-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 6px;
        }
        .ui-btn:hover {
            background: #444;
        }
        .ui-panel label {
            font-size: 12px;
            margin-left: 6px;
            cursor: pointer;
            vertical-align: middle;
        }
        .ui-panel input[type="checkbox"] {
            cursor: pointer;
            vertical-align: middle;
            margin-left: 4px;
        }

        .keypad-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid #444;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            text-align: center;
        }
        .keypad-display {
            background: #111;
            border: 1px solid #555;
            color: #00ffcc;
            font-size: 20px;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            letter-spacing: 2px;
        }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
            justify-content: center;
        }
        .keypad-btn {
            background: #2a2a3a;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .keypad-btn:hover {
            background: #3a3a4a;
        }
        .keypad-btn.action {
            background: #332222;
        }
        .keypad-btn.action:hover {
            background: #442a2a;
        }
        .keypad-btn.ok {
            background: #1b4d3e;
            grid-column: span 3;
        }
        .keypad-btn.ok:hover {
            background: #236350;
        }
    </style>
</head>
<body>

    <div class="ui-panel" id="uiPanel">
        <div>モード: <span id="modeText" style="color: #00ffcc; font-weight: bold;">分裂中</span> <button class="ui-btn" id="toggleModeBtn">切替</button></div>
        <div>ボール数: <span id="ballCount">2</span></div>
        <div>上限数: <span id="maxLimitVal">0</span> <button class="ui-btn" id="openMaxKeypadBtn">変更</button></div>
        <div>下限数: <span id="minLimitVal">2</span> <button class="ui-btn" id="openMinKeypadBtn">変更</button></div>
        <div>スピード: <span id="speedVal">3.5</span> <button class="ui-btn" id="openSpeedKeypadBtn">変更</button><label><input type="checkbox" id="randomSpeedCheck">ランダム</label></div>
        <div>表示: <button class="ui-btn" id="fullscreenBtn">全画面にする</button></div>
    </div>

    <div class="keypad-modal" id="keypadModal">
        <div style="margin-bottom: 8px; font-size: 13px; color: #aaa;" id="keypadTitle">数値を入力</div>
        <div class="keypad-display" id="keypadDisplay">0</div>
        <div class="keypad-grid">
            <button class="keypad-btn" data-val="1">1</button>
            <button class="keypad-btn" data-val="2">2</button>
            <button class="keypad-btn" data-val="3">3</button>
            <button class="keypad-btn" data-val="4">4</button>
            <button class="keypad-btn" data-val="5">5</button>
            <button class="keypad-btn" data-val="6">6</button>
            <button class="keypad-btn" data-val="7">7</button>
            <button class="keypad-btn" data-val="8">8</button>
            <button class="keypad-btn" data-val="9">9</button>
            <button class="keypad-btn action" id="clearBtn">C</button>
            <button class="keypad-btn" data-val="0">0</button>
            <button class="keypad-btn action" id="backBtn">←</button>
            <button class="keypad-btn ok" id="okBtn">確定</button>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const modeText = document.getElementById('modeText');
        const toggleModeBtn = document.getElementById('toggleModeBtn');
        const ballCountSpan = document.getElementById('ballCount');
        const uiPanel = document.getElementById('uiPanel');
        const maxLimitValSpan = document.getElementById('maxLimitVal');
        const minLimitValSpan = document.getElementById('minLimitVal');
        const speedValSpan = document.getElementById('speedVal');
        const randomSpeedCheck = document.getElementById('randomSpeedCheck');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        
        const keypadModal = document.getElementById('keypadModal');
        const keypadTitle = document.getElementById('keypadTitle');
        const keypadDisplay = document.getElementById('keypadDisplay');
        const openMaxKeypadBtn = document.getElementById('openMaxKeypadBtn');
        const openMinKeypadBtn = document.getElementById('openMinKeypadBtn');
        const openSpeedKeypadBtn = document.getElementById('openSpeedKeypadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const backBtn = document.getElementById('backBtn');
        const okBtn = document.getElementById('okBtn');

        const MIN_RADIUS = 5;
        let MAX_LIMIT = 1000;
        let MIN_LIMIT = 2;
        let BALL_SPEED = 3.5;
        let isRandomSpeed = false;
        let mode = 'SPLITTING';
        let uiVisible = true;
        let isKeypadOpen = false;
        let inputBuffer = '';
        let activeTarget = 'MAX';

        function updateModeDisplay() {
            if (mode === 'SPLITTING') {
                modeText.textContent = '分裂中';
                modeText.style.color = '#00ffcc';
            } else {
                modeText.textContent = '吸収合体中';
                modeText.style.color = '#ff3366';
            }
        }

        toggleModeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mode = (mode === 'SPLITTING') ? 'ABSORBING' : 'SPLITTING';
            updateModeDisplay();
        });

        randomSpeedCheck.addEventListener('change', (e) => {
            e.stopPropagation();
            isRandomSpeed = randomSpeedCheck.checked;
            for (let b of balls) {
                b.assignSpeed();
            }
        });

        function calculateDefaultLimit() {
            const screenArea = window.innerWidth * window.innerHeight;
            const targetArea = screenArea * 0.8;
            const minBallArea = Math.PI * MIN_RADIUS * MIN_RADIUS;
            let calculated = Math.floor(targetArea / minBallArea * 0.7);
            return Math.max(10, calculated);
        }

        let lastWidth = window.innerWidth;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            if (MAX_LIMIT === 0 || window.innerWidth !== lastWidth) {
                MAX_LIMIT = calculateDefaultLimit();
                maxLimitValSpan.textContent = MAX_LIMIT;
            }
            lastWidth = window.innerWidth;
        }

        MAX_LIMIT = calculateDefaultLimit();
        maxLimitValSpan.textContent = MAX_LIMIT;
        minLimitValSpan.textContent = MIN_LIMIT;
        speedValSpan.textContent = BALL_SPEED;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let cursorTimer = null;
        function resetCursorTimer() {
            document.body.classList.remove('hide-cursor');
            clearTimeout(cursorTimer);
            if (!isKeypadOpen) {
                cursorTimer = setTimeout(() => {
                    document.body.classList.add('hide-cursor');
                }, 3000);
            }
        }

        window.addEventListener('mousemove', resetCursorTimer);
        window.addEventListener('mousedown', resetCursorTimer);

        window.addEventListener('dblclick', (e) => {
            if (isKeypadOpen) return;
            uiVisible = !uiVisible;
            uiPanel.style.display = uiVisible ? 'block' : 'none';
        });

        fullscreenBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`全画面化に失敗しました: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                fullscreenBtn.textContent = '全画面解除';
            } else {
                fullscreenBtn.textContent = '全画面にする';
            }
        });

        openMaxKeypadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeTarget = 'MAX';
            keypadTitle.textContent = '上限数を入力';
            openKeypad(MAX_LIMIT);
        });

        openMinKeypadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeTarget = 'MIN';
            keypadTitle.textContent = '下限数を入力 (2以上)';
            openKeypad(MIN_LIMIT);
        });

        openSpeedKeypadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            activeTarget = 'SPEED';
            keypadTitle.textContent = 'スピードを入力 (無制限)';
            openKeypad(BALL_SPEED);
        });

        function openKeypad(currentVal) {
            isKeypadOpen = true;
            document.body.classList.remove('hide-cursor');
            clearTimeout(cursorTimer);
            inputBuffer = currentVal.toString();
            keypadDisplay.textContent = inputBuffer;
            keypadModal.style.display = 'block';
        }

        document.querySelectorAll('.keypad-btn[data-val]').forEach(btn => {
            btn.addEventListener('click', () => {
                let val = btn.getAttribute('data-val');
                if (inputBuffer === '0') {
                    inputBuffer = val;
                } else {
                    inputBuffer += val;
                }
                keypadDisplay.textContent = inputBuffer;
            });
        });

        clearBtn.addEventListener('click', () => {
            inputBuffer = '0';
            keypadDisplay.textContent = inputBuffer;
        });

        backBtn.addEventListener('click', () => {
            if (inputBuffer.length > 1) {
                inputBuffer = inputBuffer.slice(0, -1);
            } else {
                inputBuffer = '0';
            }
            keypadDisplay.textContent = inputBuffer;
        });

        okBtn.addEventListener('click', () => {
            let num = parseFloat(inputBuffer); // 少数対応（必要に応じて整数にしたい場合は parseInt）
            if (isNaN(num)) num = 1;

            if (activeTarget === 'MAX') {
                num = parseInt(inputBuffer, 10);
                if (num < 2) num = 2;
                MAX_LIMIT = num;
                maxLimitValSpan.textContent = MAX_LIMIT;
                if (MIN_LIMIT >= MAX_LIMIT) {
                    MIN_LIMIT = Math.max(2, MAX_LIMIT - 1);
                    minLimitValSpan.textContent = MIN_LIMIT;
                }
            } else if (activeTarget === 'MIN') {
                num = parseInt(inputBuffer, 10);
                if (num < 2) num = 2;
                if (num >= MAX_LIMIT) num = MAX_LIMIT - 1;
                MIN_LIMIT = num;
                minLimitValSpan.textContent = MIN_LIMIT;
            } else if (activeTarget === 'SPEED') {
                if (num < 0) num = 0;
                BALL_SPEED = num;
                speedValSpan.textContent = BALL_SPEED;
                for (let b of balls) {
                    b.assignSpeed();
                }
            }

            keypadModal.style.display = 'none';
            isKeypadOpen = false;
            resetCursorTimer();

            if (mode === 'SPLITTING' && balls.length >= MAX_LIMIT) {
                mode = 'ABSORBING';
                updateModeDisplay();
            } else if (mode === 'ABSORBING' && balls.length <= MIN_LIMIT) {
                mode = 'SPLITTING';
                updateModeDisplay();
            }
        });

        class Ball {
            constructor(x, y, vx, vy, radius, color, cooldown = 0) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.cooldown = cooldown;
                this.vx = vx;
                this.vy = vy;
                this.assignSpeed();
            }

            assignSpeed() {
                let currentSpeed = Math.hypot(this.vx, this.vy);
                if (currentSpeed === 0) {
                    let angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle);
                    this.vy = Math.sin(angle);
                    currentSpeed = 1;
                }
                
                let targetSpeed = isRandomSpeed ? (Math.random() * (BALL_SPEED * 1.5) + 0.8) : BALL_SPEED;
                this.vx = (this.vx / currentSpeed) * targetSpeed;
                this.vy = (this.vy / currentSpeed) * targetSpeed;
            }

            update(subSteps) {
                let dt = 1 / subSteps;
                for (let s = 0; s < subSteps; s++) {
                    this.x += this.vx * dt;
                    this.y += this.vy * dt;

                    if (this.x - this.radius < 0) {
                        this.x = this.radius;
                        this.vx *= -1;
                    } else if (this.x + this.radius > canvas.width) {
                        this.x = canvas.width - this.radius;
                        this.vx *= -1;
                    }

                    if (this.y - this.radius < 0) {
                        this.y = this.radius;
                        this.vy *= -1;
                    } else if (this.y + this.radius > canvas.height) {
                        this.y = canvas.height - this.radius;
                        this.vy *= -1;
                    }
                }

                if (this.cooldown > 0) {
                    this.cooldown--;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        let balls = [
            new Ball(canvas.width / 2 - 100, canvas.height / 2, 1, 1, 28, '#ff3366'),
            new Ball(canvas.width / 2 + 100, canvas.height / 2, -1, -1, 28, '#00d2ff')
        ];

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 85%, 60%)`;
        }

        function handleCollisions() {
            if (balls.length <= 1) {
                if (mode === 'ABSORBING') {
                    mode = 'SPLITTING';
                    updateModeDisplay();
                }
                if (balls.length === 1) {
                    let b = balls[0];
                    let r = Math.max(b.radius * 0.7, MIN_RADIUS);
                    b.radius = r;
                    balls.push(new Ball(b.x + 50, b.y, -b.vx, -b.vy, r, getRandomColor(), 30));
                } else {
                    balls.push(new Ball(canvas.width / 2 - 50, canvas.height / 2, 1, 1, 25, getRandomColor(), 10));
                    balls.push(new Ball(canvas.width / 2 + 50, canvas.height / 2, -1, -1, 25, getRandomColor(), 10));
                }
            }

            const cellSize = 50;
            const grid = new Map();

            for (let i = 0; i < balls.length; i++) {
                let b = balls[i];
                let cx = Math.floor(b.x / cellSize);
                let cy = Math.floor(b.y / cellSize);
                let key = `${cx},${cy}`;
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(i);
            }

            const ballsToAdd = [];
            const ballsToRemove = new Set();

            for (let i = 0; i < balls.length; i++) {
                if (ballsToRemove.has(balls[i])) continue;
                let b1 = balls[i];

                let cx = Math.floor(b1.x / cellSize);
                let cy = Math.floor(b1.y / cellSize);

                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        let key = `${cx + dx},${cy + dy}`;
                        let cell = grid.get(key);
                        if (!cell) continue;

                        for (let k = 0; k < cell.length; k++) {
                            let j = cell[k];
                            if (i >= j || ballsToRemove.has(balls[j])) continue;
                            let b2 = balls[j];

                            let distX = b2.x - b1.x;
                            let distY = b2.y - b1.y;
                            let distance = Math.hypot(distX, distY);

                            if (distance < b1.radius + b2.radius) {
                                let nx = distX / distance;
                                let ny = distY / distance;

                                let rvx = b2.vx - b1.vx;
                                let rvy = b2.vy - b1.vy;
                                let velAlongNormal = rvx * nx + rvy * ny;

                                if (velAlongNormal < 0) {
                                    if (isRandomSpeed) {
                                        let m1 = b1.radius * b1.radius;
                                        let m2 = b2.radius * b2.radius;
                                        let e = 1.0;
                                        let impulseScalar = -(1 + e) * velAlongNormal / (1/m1 + 1/m2);

                                        b1.vx -= (impulseScalar / m1) * nx;
                                        b1.vy -= (impulseScalar / m1) * ny;
                                        b2.vx += (impulseScalar / m2) * nx;
                                        b2.vy += (impulseScalar / m2) * ny;
                                    } else {
                                        let speed1 = Math.hypot(b1.vx, b1.vy);
                                        let speed2 = Math.hypot(b2.vx, b2.vy);
                                        let dir1 = Math.atan2(b1.vy, b1.vx);
                                        let dir2 = Math.atan2(b2.vy, b2.vx);
                                        let angle = Math.atan2(distY, distX);

                                        let newVx1 = speed2 * Math.cos(dir2 - angle) * Math.cos(angle) + speed1 * Math.sin(dir1 - angle) * Math.cos(angle + Math.PI / 2);
                                        let newVy1 = speed2 * Math.cos(dir2 - angle) * Math.sin(angle) + speed1 * Math.sin(dir1 - angle) * Math.sin(angle + Math.PI / 2);
                                        let newVx2 = speed1 * Math.cos(dir1 - angle) * Math.cos(angle) + speed2 * Math.sin(dir2 - angle) * Math.cos(angle + Math.PI / 2);
                                        let newVy2 = speed1 * Math.cos(dir1 - angle) * Math.sin(angle) + speed2 * Math.sin(dir2 - angle) * Math.sin(angle + Math.PI / 2);

                                        b1.vx = newVx1;
                                        b1.vy = newVy1;
                                        b2.vx = newVx2;
                                        b2.vy = newVy2;

                                        let curSpeed1 = Math.hypot(b1.vx, b1.vy);
                                        if (curSpeed1 > 0) {
                                            b1.vx = (b1.vx / curSpeed1) * BALL_SPEED;
                                            b1.vy = (b1.vy / curSpeed1) * BALL_SPEED;
                                        }
                                        let curSpeed2 = Math.hypot(b2.vx, b2.vy);
                                        if (curSpeed2 > 0) {
                                            b2.vx = (b2.vx / curSpeed2) * BALL_SPEED;
                                            b2.vy = (b2.vy / curSpeed2) * BALL_SPEED;
                                        }
                                    }
                                }

                                let overlap = (b1.radius + b2.radius) - distance;
                                let m1 = b1.radius * b1.radius;
                                let m2 = b2.radius * b2.radius;
                                let totalM = m1 + m2;
                                b1.x -= nx * overlap * (m2 / totalM);
                                b1.y -= ny * overlap * (m2 / totalM);
                                b2.x += nx * overlap * (m1 / totalM);
                                b2.y += ny * overlap * (m1 / totalM);

                                if (mode === 'SPLITTING') {
                                    if (b1.cooldown === 0 && b2.cooldown === 0 && balls.length + ballsToAdd.length < MAX_LIMIT) {
                                        ballsToRemove.add(b1);
                                        ballsToRemove.add(b2);

                                        let r1 = Math.max(b1.radius * 0.75, MIN_RADIUS);
                                        let r2 = Math.max(b2.radius * 0.75, MIN_RADIUS);

                                        let newB1 = new Ball(b1.x - nx*r1, b1.y - ny*r1, b1.vx, b1.vy, r1, getRandomColor(), 20);
                                        let newB2 = new Ball(b1.x + nx*r1, b1.y + ny*r1, -b1.vx, -b1.vy, r1, getRandomColor(), 20);
                                        let newB3 = new Ball(b2.x - nx*r2, b2.y - ny*r2, b2.vx, b2.vy, r2, getRandomColor(), 20);
                                        let newB4 = new Ball(b2.x + nx*r2, b2.y + ny*r2, -b2.vx, -b2.vy, r2, getRandomColor(), 20);

                                        ballsToAdd.push(newB1, newB2, newB3, newB4);
                                    }
                                } else if (mode === 'ABSORBING') {
                                    let currentActiveCount = balls.length - ballsToRemove.size + ballsToAdd.length;
                                    if (currentActiveCount > 2) {
                                        ballsToRemove.add(b1);
                                        ballsToRemove.add(b2);

                                        let mergedRadius = Math.min(Math.hypot(b1.radius, b2.radius) * 0.9, 50);
                                        let mergedX = (b1.x + b2.x) / 2;
                                        let mergedY = (b1.y + b2.y) / 2;
                                        let mergedVx = (b1.vx * m1 + b2.vx * m2) / totalM;
                                        let mergedVy = (b1.vy * m1 + b2.vy * m2) / totalM;

                                        ballsToAdd.push(new Ball(mergedX, mergedY, mergedVx, mergedVy, mergedRadius, getRandomColor(), 10));
                                    }
                                }
                                break;
                            }
                        }
                    }
                }
            }

            if (ballsToRemove.size > 0) {
                balls = balls.filter(b => !ballsToRemove.has(b));
                balls.push(...ballsToAdd);
            }

            if (mode === 'SPLITTING' && balls.length >= MAX_LIMIT) {
                mode = 'ABSORBING';
                updateModeDisplay();
            } else if (mode === 'ABSORBING' && balls.length <= MIN_LIMIT) {
                mode = 'SPLITTING';
                updateModeDisplay();
            }

            ballCountSpan.textContent = balls.length;
        }

        canvas.addEventListener('click', (e) => {
            if (isKeypadOpen) return;
            if (balls.length < MAX_LIMIT) {
                balls.push(new Ball(e.clientX, e.clientY, Math.random() - 0.5, Math.random() - 0.5, 18, getRandomColor(), 10));
            }
        });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            handleCollisions();

            // スピードが上がった場合でも画面外をすり抜けないよう、分割数（subSteps）を自動で動的スケールアップします
            let currentMaxSpeed = isRandomSpeed ? BALL_SPEED * 1.5 : BALL_SPEED;
            let subSteps = Math.max(1, Math.ceil(currentMaxSpeed / 3));

            for (let i = 0; i < balls.length; i++) {
                balls[i].update(subSteps);
                balls[i].draw();
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
