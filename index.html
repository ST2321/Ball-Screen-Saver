<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボールシミュレーション</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #09090e;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: #fff;
            user-select: none;
        }
        body.hide-cursor {
            cursor: none;
        }
        canvas {
            display: block;
            background: #12121c;
        }
        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #333;
            font-size: 14px;
            letter-spacing: 0.05em;
            z-index: 10;
            transition: opacity 0.3s ease;
        }
        .ui-panel div {
            margin-bottom: 6px;
        }
        .limit-btn {
            background: #333;
            color: #fff;
            border: 1px solid #555;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 6px;
        }
        .limit-btn:hover {
            background: #444;
        }

        .keypad-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid #444;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            text-align: center;
        }
        .keypad-display {
            background: #111;
            border: 1px solid #555;
            color: #00ffcc;
            font-size: 20px;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 6px;
            letter-spacing: 2px;
        }
        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            gap: 8px;
            justify-content: center;
        }
        .keypad-btn {
            background: #2a2a3a;
            color: #fff;
            border: 1px solid #444;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.1s;
        }
        .keypad-btn:hover {
            background: #3a3a4a;
        }
        .keypad-btn.action {
            background: #332222;
        }
        .keypad-btn.action:hover {
            background: #442a2a;
        }
        .keypad-btn.ok {
            background: #1b4d3e;
            grid-column: span 3;
        }
        .keypad-btn.ok:hover {
            background: #236350;
        }
    </style>
</head>
<body>

    <div class="ui-panel" id="uiPanel">
        <div>モード: <span id="modeText" style="color: #00ffcc; font-weight: bold;">分裂中 (SPLITTING)</span></div>
        <div>ボール数: <span id="ballCount">2</span></div>
        <div>上限数: <span id="maxLimitVal">0</span> <button class="limit-btn" id="openKeypadBtn">変更</button></div>
    </div>

    <div class="keypad-modal" id="keypadModal">
        <div style="margin-bottom: 8px; font-size: 13px; color: #aaa;">上限数を入力</div>
        <div class="keypad-display" id="keypadDisplay">0</div>
        <div class="keypad-grid">
            <button class="keypad-btn" data-val="1">1</button>
            <button class="keypad-btn" data-val="2">2</button>
            <button class="keypad-btn" data-val="3">3</button>
            <button class="keypad-btn" data-val="4">4</button>
            <button class="keypad-btn" data-val="5">5</button>
            <button class="keypad-btn" data-val="6">6</button>
            <button class="keypad-btn" data-val="7">7</button>
            <button class="keypad-btn" data-val="8">8</button>
            <button class="keypad-btn" data-val="9">9</button>
            <button class="keypad-btn action" id="clearBtn">C</button>
            <button class="keypad-btn" data-val="0">0</button>
            <button class="keypad-btn action" id="backBtn">←</button>
            <button class="keypad-btn ok" id="okBtn">確定</button>
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const modeText = document.getElementById('modeText');
        const ballCountSpan = document.getElementById('ballCount');
        const uiPanel = document.getElementById('uiPanel');
        const maxLimitValSpan = document.getElementById('maxLimitVal');
        
        const keypadModal = document.getElementById('keypadModal');
        const keypadDisplay = document.getElementById('keypadDisplay');
        const openKeypadBtn = document.getElementById('openKeypadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const backBtn = document.getElementById('backBtn');
        const okBtn = document.getElementById('okBtn');

        const MIN_RADIUS = 5; // 最小ボールサイズ
        let MAX_LIMIT = 1000;
        const BALL_SPEED = 3.5;
        let mode = 'SPLITTING';
        let uiVisible = true;
        let isKeypadOpen = false;
        let inputBuffer = '';

        function calculateDefaultLimit() {
            const screenArea = window.innerWidth * window.innerHeight;
            const targetArea = screenArea * 0.8;
            const minBallArea = Math.PI * MIN_RADIUS * MIN_RADIUS;
            // 充填率の理論値（ヘキサゴナル充填で約0.91）を考慮しつつ、隙間を引いて計算
            let calculated = Math.floor(targetArea / minBallArea * 0.7);
            return Math.max(10, calculated);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // 初期化時またはリサイズ時にデフォルト上限数を自動計算（ユーザーが手動変更していない場合など）
            if (MAX_LIMIT === 0 || window.innerWidth !== lastWidth) {
                MAX_LIMIT = calculateDefaultLimit();
                maxLimitValSpan.textContent = MAX_LIMIT;
            }
            lastWidth = window.innerWidth;
        }

        let lastWidth = window.innerWidth;
        MAX_LIMIT = calculateDefaultLimit();
        maxLimitValSpan.textContent = MAX_LIMIT;

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let cursorTimer = null;
        function resetCursorTimer() {
            document.body.classList.remove('hide-cursor');
            clearTimeout(cursorTimer);
            if (!isKeypadOpen) {
                cursorTimer = setTimeout(() => {
                    document.body.classList.add('hide-cursor');
                }, 3000);
            }
        }

        window.addEventListener('mousemove', resetCursorTimer);
        window.addEventListener('mousedown', resetCursorTimer);

        window.addEventListener('dblclick', (e) => {
            if (isKeypadOpen) return;
            uiVisible = !uiVisible;
            uiPanel.style.display = uiVisible ? 'block' : 'none';
        });

        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                uiPanel.style.display = 'none';
                uiVisible = false;
            }
        });

        openKeypadBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isKeypadOpen = true;
            document.body.classList.remove('hide-cursor');
            clearTimeout(cursorTimer);
            inputBuffer = MAX_LIMIT.toString();
            keypadDisplay.textContent = inputBuffer;
            keypadModal.style.display = 'block';
        });

        document.querySelectorAll('.keypad-btn[data-val]').forEach(btn => {
            btn.addEventListener('click', () => {
                let val = btn.getAttribute('data-val');
                if (inputBuffer === '0') {
                    inputBuffer = val;
                } else {
                    inputBuffer += val;
                }
                keypadDisplay.textContent = inputBuffer;
            });
        });

        clearBtn.addEventListener('click', () => {
            inputBuffer = '0';
            keypadDisplay.textContent = inputBuffer;
        });

        backBtn.addEventListener('click', () => {
            if (inputBuffer.length > 1) {
                inputBuffer = inputBuffer.slice(0, -1);
            } else {
                inputBuffer = '0';
            }
            keypadDisplay.textContent = inputBuffer;
        });

        okBtn.addEventListener('click', () => {
            let num = parseInt(inputBuffer, 10);
            if (isNaN(num) || num < 2) num = 2;
            MAX_LIMIT = num;
            maxLimitValSpan.textContent = MAX_LIMIT;
            keypadModal.style.display = 'none';
            isKeypadOpen = false;
            resetCursorTimer();

            if (mode === 'SPLITTING' && balls.length >= MAX_LIMIT) {
                mode = 'ABSORBING';
                modeText.textContent = '吸収合体中 (ABSORBING)';
                modeText.style.color = '#ff3366';
            }
        });

        class Ball {
            constructor(x, y, vx, vy, radius, color, cooldown = 0) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.cooldown = cooldown;
                this.setSpeed(vx, vy);
            }

            setSpeed(vx, vy) {
                let currentSpeed = Math.hypot(vx, vy);
                if (currentSpeed === 0) {
                    vx = BALL_SPEED;
                    vy = 0;
                    currentSpeed = BALL_SPEED;
                }
                this.vx = (vx / currentSpeed) * BALL_SPEED;
                this.vy = (vy / currentSpeed) * BALL_SPEED;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -1;
                } else if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -1;
                }

                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.vy *= -1;
                } else if (this.y + this.radius > canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy *= -1;
                }

                this.setSpeed(this.vx, this.vy);

                if (this.cooldown > 0) {
                    this.cooldown--;
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.closePath();
            }
        }

        let balls = [
            new Ball(canvas.width / 2 - 100, canvas.height / 2, 1, 1, 28, '#ff3366'),
            new Ball(canvas.width / 2 + 100, canvas.height / 2, -1, -1, 28, '#00d2ff')
        ];

        function getRandomColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 85%, 60%)`;
        }

        function handleCollisions() {
            if (balls.length < 2) return;

            const cellSize = 50;
            const grid = new Map();

            for (let i = 0; i < balls.length; i++) {
                let b = balls[i];
                let cx = Math.floor(b.x / cellSize);
                let cy = Math.floor(b.y / cellSize);
                let key = `${cx},${cy}`;
                if (!grid.has(key)) grid.set(key, []);
                grid.get(key).push(i);
            }

            const ballsToAdd = [];
            const ballsToRemove = new Set();

            for (let i = 0; i < balls.length; i++) {
                if (ballsToRemove.has(balls[i])) continue;
                let b1 = balls[i];

                let cx = Math.floor(b1.x / cellSize);
                let cy = Math.floor(b1.y / cellSize);

                for (let dx = -1; dx <= 1; dx++) {
                    for (let dy = -1; dy <= 1; dy++) {
                        let key = `${cx + dx},${cy + dy}`;
                        let cell = grid.get(key);
                        if (!cell) continue;

                        for (let k = 0; k < cell.length; k++) {
                            let j = cell[k];
                            if (i >= j || ballsToRemove.has(balls[j])) continue;
                            let b2 = balls[j];

                            let distX = b2.x - b1.x;
                            let distY = b2.y - b1.y;
                            let distance = Math.hypot(distX, distY);

                            if (distance < b1.radius + b2.radius) {
                                let angle = Math.atan2(distY, distX);
                                let speed1 = Math.hypot(b1.vx, b1.vy);
                                let speed2 = Math.hypot(b2.vx, b2.vy);
                                let dir1 = Math.atan2(b1.vy, b1.vx);
                                let dir2 = Math.atan2(b2.vy, b2.vx);

                                let newVx1 = speed2 * Math.cos(dir2 - angle) * Math.cos(angle) + speed1 * Math.sin(dir1 - angle) * Math.cos(angle + Math.PI / 2);
                                let newVy1 = speed2 * Math.cos(dir2 - angle) * Math.sin(angle) + speed1 * Math.sin(dir1 - angle) * Math.sin(angle + Math.PI / 2);

                                let newVx2 = speed1 * Math.cos(dir1 - angle) * Math.cos(angle) + speed2 * Math.sin(dir2 - angle) * Math.cos(angle + Math.PI / 2);
                                let newVy2 = speed1 * Math.cos(dir1 - angle) * Math.sin(angle) + speed2 * Math.sin(dir2 - angle) * Math.sin(angle + Math.PI / 2);

                                b1.setSpeed(newVx1, newVy1);
                                b2.setSpeed(newVx2, newVy2);

                                let overlap = (b1.radius + b2.radius) - distance;
                                b1.x -= overlap * Math.cos(angle) * 0.5;
                                b1.y -= overlap * Math.sin(angle) * 0.5;
                                b2.x += overlap * Math.cos(angle) * 0.5;
                                b2.y += overlap * Math.sin(angle) * 0.5;

                                if (mode === 'SPLITTING') {
                                    if (b1.cooldown === 0 && b2.cooldown === 0 && balls.length + ballsToAdd.length < MAX_LIMIT) {
                                        ballsToRemove.add(b1);
                                        ballsToRemove.add(b2);

                                        let r1 = Math.max(b1.radius * 0.75, MIN_RADIUS);
                                        let r2 = Math.max(b2.radius * 0.75, MIN_RADIUS);

                                        ballsToAdd.push(new Ball(b1.x - Math.cos(angle)*r1, b1.y - Math.sin(angle)*r1, b1.vx, b1.vy, r1, getRandomColor(), 20));
                                        ballsToAdd.push(new Ball(b1.x + Math.cos(angle)*r1, b1.y + Math.sin(angle)*r1, -b1.vx, -b1.vy, r1, getRandomColor(), 20));
                                        ballsToAdd.push(new Ball(b2.x - Math.cos(angle)*r2, b2.y - Math.sin(angle)*r2, b2.vx, b2.vy, r2, getRandomColor(), 20));
                                        ballsToAdd.push(new Ball(b2.x + Math.cos(angle)*r2, b2.y + Math.sin(angle)*r2, -b2.vx, -b2.vy, r2, getRandomColor(), 20));
                                    }
                                } else if (mode === 'ABSORBING') {
                                    ballsToRemove.add(b1);
                                    ballsToRemove.add(b2);

                                    let mergedRadius = Math.min(Math.hypot(b1.radius, b2.radius) * 0.9, 50);
                                    let mergedX = (b1.x + b2.x) / 2;
                                    let mergedY = (b1.y + b2.y) / 2;
                                    let mergedVx = (b1.vx + b2.vx) / 2;
                                    let mergedVy = (b1.vy + b2.vy) / 2;

                                    ballsToAdd.push(new Ball(mergedX, mergedY, mergedVx, mergedVy, mergedRadius, getRandomColor(), 10));
                                }
                                break;
                            }
                        }
                    }
                }
            }

            if (ballsToRemove.size > 0) {
                balls = balls.filter(b => !ballsToRemove.has(b));
                balls.push(...ballsToAdd);
            }

            if (mode === 'SPLITTING' && balls.length >= MAX_LIMIT) {
                mode = 'ABSORBING';
                modeText.textContent = '吸収合体中 (ABSORBING)';
                modeText.style.color = '#ff3366';
            } else if (mode === 'ABSORBING' && balls.length <= 2) {
                mode = 'SPLITTING';
                modeText.textContent = '分裂中 (SPLITTING)';
                modeText.style.color = '#00ffcc';
            }

            ballCountSpan.textContent = balls.length;
        }

        canvas.addEventListener('click', (e) => {
            if (isKeypadOpen) return;
            if (balls.length < MAX_LIMIT) {
                balls.push(new Ball(e.clientX, e.clientY, Math.random() - 0.5, Math.random() - 0.5, 18, getRandomColor(), 10));
            }
        });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            handleCollisions();

            for (let i = 0; i < balls.length; i++) {
                balls[i].update();
                balls[i].draw();
            }

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
